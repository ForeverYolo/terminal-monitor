<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terminal Monitor</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- Network disconnect overlay -->
<div id="network-overlay">网络断开，重连中...</div>

<!-- Hidden file input for upload trigger -->
<input type="file" id="file-input" style="display:none">

<!-- File browser modal -->
<div id="file-modal">
  <div class="file-modal-box">
    <div class="file-modal-header">
      <span class="file-modal-title">📁 文件浏览器</span>
      <button class="file-modal-close" onclick="closeFileBrowser()">✕</button>
    </div>
    <div class="file-modal-path">
      <button onclick="fileBrowserUp()" id="file-up-btn">↑ 上级</button>
      <span id="file-modal-cwd">/</span>
    </div>
    <div id="file-modal-list" class="file-modal-list"></div>
  </div>
</div>

<!-- File transfer progress overlay -->
<div id="file-progress">
  <div id="file-progress-name"></div>
  <div class="file-progress-bar"><div id="file-progress-fill"></div></div>
  <div id="file-progress-status"></div>
</div>

<!-- Lightweight toast -->
<div id="toast"></div>

<!-- Login View -->
<div id="login-view">
  <div class="login-box">
    <h1>Screen Web Terminal</h1>
    <p>Enter username and password to continue</p>
    <div class="login-error" id="login-error"></div>
    <input type="text" id="username-input" placeholder="Username">
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <button onclick="doLogin()">Login</button>
    <p style="margin:16px 0 0; font-size:12px;"><a href="/guide.html" target="_blank" style="color:#4a9eff; text-decoration:none;">📖 第一次用？看使用指南</a></p>
  </div>
  <div class="icp-footer"><a href="https://beian.miit.gov.cn/" target="_blank">京ICP备2026065181号-1</a></div>
</div>

<!-- Dashboard View -->
<div id="dash-view">
  <div id="dash-header">
    <h2>Screen Web Terminal</h2>
    <div class="right-area">
      <div class="mode-switch" id="sort-switch">
        <button class="active" data-sort="name">名字</button>
        <button data-sort="id">编号</button>
        <button data-sort="recent">最近</button>
      </div>
      <div class="mode-switch" id="view-mode-switch">
        <button class="active" data-mode="card">卡片</button>
        <button data-mode="multi">多屏</button>
        <button data-mode="mgmt" id="mode-mgmt-btn">管理</button>
      </div>
      <button id="notif-toggle" onclick="toggleNotifications()" title="需要输入时桌面通知">🔔 通知</button>
      <a href="/guide.html" target="_blank" class="logout" title="使用指南" style="text-decoration:none;">📖 指南</a>
      <span class="logout" onclick="doLogout()">Logout</span>
    </div>
  </div>
  <div id="agent-list"></div>
  <div id="mgmt-panel" style="display:none; flex:1; overflow-y:auto; padding:16px; flex-direction:column; gap:16px;">
    <details id="mgmt-settings" style="background:#0d1117; border:1px solid #21262d; border-radius:8px; padding:14px;">
      <summary style="cursor:pointer; font-size:15px; font-weight:600; color:#fff;">督工设置</summary>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#ccc;">
          <input type="checkbox" id="sup-enabled"> 启用督工
        </label>
        <div style="display:flex; flex-direction:column; gap:4px;">
          <label style="font-size:12px; color:#8b949e;">分析员 Agent（留空则只做摘要/空闲检测，不做 AI 分析）</label>
          <select id="sup-analyzer" style="background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; padding:6px;">
            <option value="">（不使用分析员）</option>
          </select>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="font-size:12px; color:#8b949e;">摘要间隔(秒)</label>
            <input type="number" id="sup-summaryInterval" min="10" max="86400" style="width:100%; box-sizing:border-box; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; padding:6px;">
          </div>
          <div>
            <label style="font-size:12px; color:#8b949e;">空闲告警阈值(秒)</label>
            <input type="number" id="sup-idleTimeout" min="10" max="86400" style="width:100%; box-sizing:border-box; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; padding:6px;">
          </div>
          <div>
            <label style="font-size:12px; color:#8b949e;">分析间隔(秒)</label>
            <input type="number" id="sup-analyzerInterval" min="10" max="86400" style="width:100%; box-sizing:border-box; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; padding:6px;">
          </div>
          <div>
            <label style="font-size:12px; color:#8b949e;">分析超时(秒)</label>
            <input type="number" id="sup-analyzerTimeout" min="5" max="3600" style="width:100%; box-sizing:border-box; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; padding:6px;">
          </div>
        </div>
        <div>
          <label style="font-size:12px; color:#8b949e;">Webhook URL（留空则不通知）</label>
          <input type="text" id="sup-webhook" placeholder="https://..." style="width:100%; box-sizing:border-box; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; padding:6px;">
        </div>
        <div>
          <button onclick="saveSupervisorConfig()" style="background:#2a6e4a; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:13px;">保存并应用</button>
          <button onclick="pushUpdateAll()" style="background:#2a4a6e; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:13px; margin-left:8px;">⬆ 全部推送更新</button>
          <button onclick="restartServer()" style="background:#6e2a2a; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:13px; margin-left:8px;">⟳ 重启服务器应用更新</button>
          <span id="sup-save-status" style="margin-left:10px; font-size:12px; color:#8b949e;"></span>
        </div>
      </div>
    </details>
    <div style="background:#0d1117; border:1px solid #21262d; border-radius:8px; padding:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 style="margin:0; font-size:15px;">督工摘要 <span id="mgmt-summary-time" style="color:#6e7681; font-size:11px; font-weight:normal;"></span></h3>
        <button onclick="requestLlmSummary()" style="background:#2a4a6e; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px;">刷新 LLM 分析</button>
      </div>
      <div id="mgmt-summary-text" style="color:#ccc; font-size:13px; white-space:pre-wrap; line-height:1.5;">（等待督工事件…）</div>
      <div id="mgmt-suggestions" style="margin-top:10px;"></div>
    </div>
    <div id="mgmt-clients" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>
  <div id="dash-multi-bar" style="display:none; background:#0d1117; padding:8px 16px; border-top:1px solid #21262d; flex-shrink:0; align-items:center; gap:12px;">
    <span style="color:#ccc; font-size:14px;" id="dash-multi-count">已选 0 台</span>
    <button id="dash-multi-open" onclick="openMultiTerminal()" disabled style="background:#4a9eff; color:#fff; border:none; padding:8px 18px; border-radius:6px; cursor:pointer; font-size:13px;">打开多屏</button>
    <button onclick="cancelMultiSelect()" style="background:#333; color:#aaa; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px;">取消</button>
  </div>
  <div class="icp-footer"><a href="https://beian.miit.gov.cn/" target="_blank">京ICP备2026065181号-1</a></div>
</div>

<!-- Multi View -->
<div id="multi-view">
  <div id="multi-toolbar">
    <span class="back" onclick="closeMultiView()">&larr; 返回</span>
    <span class="title" id="multi-title">已选 0 台设备</span>
    <button class="open-btn" id="btn-open-multi" onclick="openMultiTerminal()" disabled>打开所选</button>
  </div>
  <div id="multi-container"></div>
</div>

<!-- Terminal View -->
<div id="term-view">
  <button id="float-back" onclick="closeTerminal()">&larr; Back</button>
  <button id="float-upload" onclick="onUploadClickFor(currentAgentId)" title="上传文件到终端当前目录">📤</button>
  <button id="float-download" onclick="openFileBrowserFor(currentAgentId)" title="从终端当前目录下载文件">📥</button>
  <button id="float-toggle-view" onclick="toggleTermView()">结构</button>
  <div id="term-overlay"></div>
  <div id="term-container"></div>
  <div id="structured-view">
    <div id="struct-transcript"></div>
    <div id="struct-actionbar"></div>
    <div id="struct-input-row">
      <input id="struct-input" type="text" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入命令…">
      <button id="struct-send" onclick="structSendInput()">发送</button>
    </div>
    <div id="struct-quickkeys">
      <button onclick="structKey('ctrlc')">^C</button>
      <button onclick="structKey('esc')">Esc</button>
      <button onclick="structKey('tab')">Tab</button>
      <button onclick="structKey('up')">↑</button>
      <button onclick="structKey('down')">↓</button>
      <button onclick="structKey('enter')">⏎</button>
    </div>
  </div>
  <div id="mobile-toolbar">
    <div id="mobile-input-area">
      <div id="mobile-input-wrap">
        <textarea id="mobile-text-input" rows="1" wrap="soft" enterkeyhint="send" placeholder="点这里打字,回车发送…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <button id="mobile-send-btn" onclick="mobileSendEnter()" title="发送回车">⏎</button>
      </div>
    </div>
    <div class="tb-row">
      <button onclick="send('\x1bOA')">↑</button>
      <button onclick="send('\x1bOB')">↓</button>
      <button onclick="send('\x1bOC')">→</button>
      <button onclick="send('\x1bOD')">←</button>
      <button onclick="send('\t')">Tab</button>
      <button onclick="send('\x1b')">Esc</button>
    </div>
    <div class="tb-row">
      <button id="btn-ctrl" onclick="toggleCtrl()">Ctrl</button>
      <button onclick="sendCtrl('c')">^C</button>
      <button onclick="sendCtrl('d')">^D</button>
      <button onclick="sendCtrl('z')">^Z</button>
      <button onclick="sendCtrl('l')">^L</button>
      <button onclick="sendCtrl('a')">^A</button>
    </div>
    <div class="tb-row">
      <button onclick="send('\x1bOH')">Home</button>
      <button onclick="send('\x1bOF')">End</button>
      <button onclick="send('\x7f')">⌫</button>
      <button onclick="focusMobileInput()" id="btn-input">键盘</button>
    </div>
    <div class="tb-row">
      <button onclick="scrollTermPages(-1)" title="向上翻一页看历史">⇞ 上翻</button>
      <button onclick="scrollTermPages(1)" title="向下翻一页">⇟ 下翻</button>
      <button id="btn-scroll-latest" onclick="scrollTermToBottom()" title="回到最新输出">⤓ 最新</button>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script defer src="/managed-files.js"></script>
<script defer src="/claude-detector.js"></script>
<script defer src="/connection.js"></script>
<script defer src="/dashboard.js"></script>
<script defer src="/terminal-session.js"></script>
<script defer src="/terminal-view.js"></script>
<script defer src="/file-browser.js"></script>
<script defer src="/notifications.js"></script>
<script defer src="/management.js"></script>
<script defer src="/multi-terminal.js"></script>
<script defer src="/mobile.js"></script>
<script defer src="/bootstrap.js"></script>
</body>
</html>
