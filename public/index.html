// --- Supervisor settings form ---
// Analyzer dropdown lists every agent name currently known, plus the
// configured value even if that agent isn't connected right now (e.g. editing
// settings before starting the analyzer node).
function buildAnalyzerOptions(selectedValue) {
  const names = new Set(lastAgents.map(a => a.name));
  if (selectedValue) names.add(selectedValue);
  return '<option value="">（不使用分析员）</option>' +
    Array.from(names).sort().map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
}

function renderSupervisorSettings() {
  const cfg = supervisorConfig || {};
  const enabledEl = document.getElementById('sup-enabled');
  const analyzerEl = document.getElementById('sup-analyzer');
  if (!enabledEl || !analyzerEl) return;   // panel not in DOM yet

  enabledEl.checked = !!cfg.enabled;
  document.getElementById('sup-summaryInterval').value = cfg.summaryInterval || 60;
  document.getElementById('sup-idleTimeout').value = cfg.idleTimeout || 600;
  document.getElementById('sup-analyzerInterval').value = cfg.analyzerInterval || 300;
  document.getElementById('sup-analyzerTimeout').value = cfg.analyzerTimeout || 120;
  document.getElementById('sup-webhook').value = cfg.webhook || '';

  const current = cfg.analyzerAgentName || '';
  analyzerEl.innerHTML = buildAnalyzerOptions(current);
  analyzerEl.value = current;
}

// Refresh just the dropdown's option list (agents connecting/disconnecting) —
// called from the periodic 10s agents broadcast, where re-running the full
// renderSupervisorSettings() would stomp on an in-progress, unsaved edit of
// the rest of the form every 10 seconds.
function refreshAnalyzerOptions() {
  const analyzerEl = document.getElementById('sup-analyzer');
  if (!analyzerEl) return;
  const selected = analyzerEl.value;
  analyzerEl.innerHTML = buildAnalyzerOptions(selected);
  analyzerEl.value = selected;
}

function saveSupervisorConfig() {
  const val = (id) => document.getElementById(id).value;
  const payload = {
    type: 'update_supervisor_config',
    enabled: document.getElementById('sup-enabled').checked,
    analyzerAgentName: val('sup-analyzer'),
    summaryInterval: Number(val('sup-summaryInterval')),
    idleTimeout: Number(val('sup-idleTimeout')),
    analyzerInterval: Number(val('sup-analyzerInterval')),
    analyzerTimeout: Number(val('sup-analyzerTimeout')),
    webhook: val('sup-webhook').trim()
  };
  const statusEl = document.getElementById('sup-save-status');
  if (statusEl) statusEl.textContent = '保存中…';
  ws.send(JSON.stringify(payload));
}

function renderMgmtSummary() {
  const txt = document.getElementById('mgmt-summary-text');
  const timeEl = document.getElementById('mgmt-summary-time');
  const suggEl = document.getElementById('mgmt-suggestions');
  if (!lastSupervisorEvent) {
    txt.textContent = '（等待督工事件…）';
    timeEl.textContent = '';
    suggEl.innerHTML = '';
    return;
  }
  const ev = lastSupervisorEvent.event || lastSupervisorEvent;
  if (ev.type === 'llm_summary') {
    txt.textContent = ev.summary || '(no summary)';
    timeEl.textContent = ' · LLM · ' + new Date(lastSupervisorEvent.time || Date.now()).toLocaleTimeString();
    if (ev.suggestions && ev.suggestions.length) {
      suggEl.innerHTML = '<div style="color:#8b949e; font-size:12px; margin-bottom:4px;">建议（只读，需手动确认）：</div>' +
        ev.suggestions.map(s => `
          <div style="display:flex; gap:6px; align-items:center; padding:6px; background:#161b22; border-radius:4px; margin-bottom:4px;">
            <span style="color:#c9d1d9; font-size:12px; flex:1;"><b>${escapeHtml(s.agentName||s.agentId||'')}</b>: <code>${escapeHtml(s.action||'')}</code> <span style="color:#6e7681;">(${escapeHtml(s.reason||'')})</span></span>
            <button onclick="applySuggestion('${(s.agentId||'').replace(/'/g,"\\'")}', '${escapeHtml((s.action||'').replace(/'/g,"\\'"))}')" style="background:#238636; color:#fff; border:none; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:11px;">注入</button>
          </div>`).join('');
    } else {
      suggEl.innerHTML = '';
    }
  } else if (ev.type === 'summary') {
    txt.textContent = ev.message || '(no message)';
    timeEl.textContent = ' · ' + new Date(lastSupervisorEvent.time || Date.now()).toLocaleTimeString();
    suggEl.innerHTML = '';
  } else {
    txt.textContent = JSON.stringify(ev, null, 2);
    timeEl.textContent = ' · ' + ev.type;
    suggEl.innerHTML = '';
  }
}

function renderMgmtClients() {
  const c = document.getElementById('mgmt-clients');
  if (!lastAgents || lastAgents.length === 0) {
    c.innerHTML = '<div style="color:#6e7681;">No agents online</div>';
    return;
  }
  // Group by clientId
  const byClient = new Map();
  for (const a of lastAgents) {
    const cid = (a.attrs && a.attrs.clientId) || a.clientId || 'unknown';
    if (!byClient.has(cid)) byClient.set(cid, []);
    byClient.get(cid).push(a);
  }
  c.innerHTML = Array.from(byClient.entries()).map(([cid, agents]) => {
    const nodeCount = agents[0] && agents[0].reportedNodeCount;
    const overLimit = agents.length >= 20;
    return `<div class="mgmt-client">
      <h4>Client: ${escapeHtml(cid)} · ${agents.length} agent(s)${nodeCount != null ? ' / ' + nodeCount + ' screen(s)' : ''}</h4>
      <div class="add-node-row">
        <input type="text" id="spawn-name-${escapeHtml(cid)}" placeholder="新节点 screen 名" maxlength="40">
        <select id="spawn-cmd-${escapeHtml(cid)}">
          <option value="bash">bash</option>
          <option value="claude">claude</option>
          <option value="sh">sh</option>
        </select>
        <button onclick="spawnNodeOnClient('${escapeHtml(cid)}')" ${overLimit?'disabled':''}>
          ${overLimit ? '已达 20 上限' : '+ 新增节点'}
        </button>
      </div>
      <div class="mgmt-agent-list">
        ${agents.map(a => {
          const cs = a.claudeState;
          const csStr = (cs && cs.running) ? ` · claude:${cs.kind}${cs.prompt ? ' "' + escapeHtml(cs.prompt.substring(0,40)) + '"' : ''}` : '';
          const rowClass = `mgmt-agent-row${attentionAgents.has(a.id) ? ' attention' : ''}`;
          const safeName = a.name.replace(/'/g, "\\'");
          return `<div class="${rowClass}">
            <span class="name">${escapeHtml(a.name)}</span>
            <span class="screen">[${escapeHtml(a.screen||'')}]</span>
            <span class="state">${a.needsInput ? '⏳等待' : '▶运行'}${csStr}</span>
            <button class="kill-btn" onclick="killNode('${a.id}','${safeName}',false)" title="断开监控，保留任务 screen">停止监控</button>
            <button class="kill-btn danger" onclick="killNode('${a.id}','${safeName}',true)" title="断开监控并终止任务 screen">终止节点</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function spawnNodeOnClient(clientId) {
  const nameInput = document.getElementById('spawn-name-' + clientId);
  const cmdSelect = document.getElementById('spawn-cmd-' + clientId);
  if (!nameInput || !cmdSelect) return;
  const screenName = nameInput.value.trim();
  const cmd = cmdSelect.value;
  if (!screenName) { alert('请输入 screen 名'); return; }
  if (!/^[A-Za-z0-9_-]{1,40}$/.test(screenName)) { alert('screen 名仅允许字母/数字/_/-，最长40'); return; }
  const reqId = 'spawn-' + Date.now().toString(36);
  pendingSpawnReqs.set(reqId, { clientId, screenName, cmd, ts: Date.now() });
  ws.send(JSON.stringify({
    type: 'spawn_node',
    reqId,
    target: { clientId },
    screenName,
    nodeName: screenName, // same as screen for simplicity
    cmd
  }));
  showFloatingNotice(`已请求在 ${clientId} 上新增节点 ${screenName}`);
}

const pendingSpawnReqs = new Map();

// Stop a node's monitoring agent, optionally also killing the task screen it
// was attached to. killTask=false leaves the underlying screen session (and
// whatever's running inside it) completely untouched — only the SWT agent
// disconnects; killTask=true tears both down.
function killNode(agentId, agentName, killTask) {
  const msg = killTask
    ? `确定要终止节点 "${agentName}" 吗？\n\n这会同时结束它监控的 screen 任务会话，任务本身也会被杀掉，无法撤销。`
    : `确定要停止监控 "${agentName}" 吗？\n\n只会断开 SWT 的监控 agent，它底下的 screen 任务会话不受影响，仍会继续运行。`;
  if (!confirm(msg)) return;
  const reqId = 'kill-' + Date.now().toString(36);
  ws.send(JSON.stringify({ type: 'kill_node', reqId, agentId, mode: killTask ? 'agent_and_task' : 'agent_only' }));
  showFloatingNotice(`已请求${killTask ? '终止' : '停止监控'} ${agentName}`);
}

function applySuggestion(agentId, action) {
  if (!agentId || !action) return;
  if (!confirm(`将注入只读命令到 ${agentId}:\n\n${action}\n\n确认？`)) return;
  // Use existing /api/action endpoint via fetch
  fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agentId, input: action + '\n' })
  }).then(r => r.json()).then(r => {
    if (r.ok) showFloatingNotice('已注入: ' + action);
    else alert('注入失败: ' + (r.error || 'unknown'));
  }).catch(e => alert('注入错误: ' + e.message));
}

function requestLlmSummary() {
  // Manually trigger via supervisor HTTP endpoint - we just refresh view;
  // server's supervisor will emit a supervisor_event on its next interval.
  fetch('/api/supervisor').then(r => r.json()).then(s => {
    if (s && s.message) {
      lastSupervisorEvent = { event: { type: 'summary', message: s.message }, time: new Date().toISOString() };
      renderMgmtSummary();
      showFloatingNotice('已刷新督工摘要');
    }
  }).catch(e => alert('刷新失败: ' + e.message));
}

function showFloatingNotice(text) {
  const el = document.getElementById('float-notice') || (() => {
    const d = document.createElement('div');
    d.id = 'float-notice';
    d.style.cssText = 'position:fixed; bottom:20px; right:20px; background:rgba(40,80,40,0.95); color:#fff; padding:10px 16px; border-radius:6px; z-index:300; font-size:12px; max-width:300px;';
    document.body.appendChild(d);
    return d;
  })();
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ========== Multi Select ==========

let lastAgents = [];

function toggleAgentSelect(agentId) {
  if (selectedAgents.has(agentId)) {
    selectedAgents.delete(agentId);
  } else {
    selectedAgents.add(agentId);
  }
  renderAgents(lastAgents);
}

function cancelMultiSelect() {
  selectedAgents.clear();
  document.getElementById('dash-multi-bar').style.display = 'none';
  setMode('card');
}

function openMultiTerminal() {
  if (selectedAgents.size === 0) return;
  showView('multi');
  document.getElementById('multi-title').textContent = `已选 ${selectedAgents.size} 台设备`;

  const container = document.getElementById('multi-container');
  container.innerHTML = '';

  // Close existing multi terms
  Object.values(multiTerms).forEach(t => { if (t.term) t.term.dispose(); });
  multiTerms = {};

  // Subscribe to all selected agents
  const agentIds = Array.from(selectedAgents);
  ws.send(JSON.stringify({ type: 'connect_multi', agentIds }));

  // Create terminal for each agent
  agentIds.forEach(agentId => {
    const agent = lastAgents.find(a => a.id === agentId);
    const name = agent ? agent.name : agentId;

    const wrap = document.createElement('div');
    wrap.className = 'multi-term-wrap';
    wrap.innerHTML = `
      <div class="multi-term-header">
        <span class="name">${escapeHtml(name)}</span>
        <div class="term-actions">
          <button title="上传到终端当前目录" onclick="onUploadClickFor('${agentId}')">📤</button>
          <button title="从终端当前目录下载" onclick="openFileBrowserFor('${agentId}')">📥</button>
          <button title="复制SSH命令" onclick="copySshCmd('${agentId}')">🔗</button>
          <button class="restart-btn" data-agent="${agentId}" title="重新attach screen会话" onclick="restartScreen('${agentId}')">🔄</button>
        </div>
        <span class="close" onclick="closeMultiTerm('${agentId}')">关闭</span>
      </div>
      <div class="multi-term-container" id="multi-term-${agentId}"></div>
    `;
    container.appendChild(wrap);

    const term = new Terminal({
      theme: { background: '#0f0f23' },
      fontSize: 12,
      cursorBlink: true,
      scrollback: 50000,
      macOptionClickForcesSelection: true
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(wrap.querySelector('.multi-term-container'));
    // Same DECCKM rationale as openTerminal: keep arrows SS3 for screen apps.
    term.write('\x1b[?1h');
    setTimeout(() => fitAddon.fit(), 50);

    multiTerms[agentId] = { term, fitAddon, container: wrap.querySelector('.multi-term-container'), filter: createAltScreenFilter() };

    // Handle input
    term.onData(data => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const bytes = new TextEncoder().encode(data);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      ws.send(JSON.stringify({ type: 'data', payload: btoa(bin), agentId }));
    });

    // Handle resize
    term.onResize(({ cols, rows }) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'resize', agentId, cols, rows }));
    });
  });

  // Handle resize
  window._multiResize = () => {
    Object.values(multiTerms).forEach(t => { if (t.fitAddon) t.fitAddon.fit(); });
  };
  window.addEventListener('resize', window._multiResize);
}

function closeMultiTerm(agentId) {
  if (multiTerms[agentId]) {
    multiTerms[agentId].term.dispose();
    delete multiTerms[agentId];
  }
  selectedAgents.delete(agentId);
  if (Object.keys(multiTerms).length === 0) {
    closeMultiView();
  } else {
    document.getElementById('multi-title').textContent = `已选 ${Object.keys(multiTerms).length} 台设备`;
  }
}

function closeMultiView() {
  if (window._multiResize) { window.removeEventListener('resize', window._multiResize); window._multiResize = null; }
  Object.values(multiTerms).forEach(t => { if (t.term) t.term.dispose(); });
  multiTerms = {};
  selectedAgents.clear();
  ws.send(JSON.stringify({ type: 'disconnect_multi' }));
  showView('dash');
  renderAgents(lastAgents);
}

// ========== Mobile structured view ==========
// Alternative to raw xterm on phones: render the terminal stream as a readable
// transcript + contextual action buttons (yes/no/options), driven by a JS port
// of claude-detector. Input goes through a normal <input> so IMEs work.

let termViewMode = 'xterm';        // 'xterm' | 'structured'
let structBuf = '';                // rolling ANSI-stripped transcript text
let structAgentId = null;
const STRUCT_BUF_MAX = 30000;
let structRenderTimer = null;
let structUserScrolled = false;

// --- ANSI stripper + detector (browser port of claude-detector.js) ---
function structStripAnsi(s) {
  return s ? s.replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g, '')
              .replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '')
              .replace(/\x1b[@-Z\\-_]/g, '') : '';
}
const STRUCT_RE = {
  banner: [/Welcome\s+to\s+Claude/i, /claude\.ai\/code/i, /Claude Code/i, /^\s*✻/m, /\bclaude[>@:]\s*$/im, /Allow\s+(Claude|me)\s+to\b/i, /\bClaude\s+is\s+(thinking|working)\b/i],
  spinner: [/^\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏◐◓◑◒*+x○●]\s+/m, /\b(thinking|cogitating|pondering|generating|analyzing|working|processing)\b[\s.]*$/i],
  yesno: [/\b(Do\s+you|Would\s+you|Are\s+you|Shall\s+I|Should\s+I|Try|Allow|Proceed|Continue)\b[^\n?]*\?/i, /❯\s*(Yes|No)\b/i, /\(\s*[Yy]\s*\/\s*[Nn]\s*\)/, /\btype\s+(yes|y|no|n)\s+to\s+/i],
  bash: [/\bAllow\s+(Claude|me)\s+to\s+(run|execute|use)\b/i, /\b(?:Run|Execute)\s+(?:bash|shell|command)\b[^\n]*\?\s*$/i, /\bpermission\s+to\s+(run|execute|edit|write|delete)\b/i],
  option: [/[\n]\s*[❯>]?\s*\d+\.\s+\S[^\n]*([\n]\s*\d+\.\s+\S[^\n]*)+\s*$/],
  input: [/^\s*>\s*$/m, /\bclaude[>@:]\s*$/im]
};
function detectClaudeStateJS(raw) {
  const text = structStripAnsi(raw || '');
  const lines = text.split('\n');
  const tail = lines.slice(-60).join('\n');
  let last = '';
  for (let i = lines.length - 1; i >= 0; i--) { if (lines[i].trim()) { last = lines[i].trim(); break; } }
  const r = { running: false, kind: 'none', prompt: '', options: [], lastLine: last.slice(0, 300) };
  if (!text.trim()) return r;
  const isClaude = STRUCT_RE.banner.some(re => re.test(text)) || STRUCT_RE.banner.some(re => re.test(tail));
  if (!isClaude) return r;
  r.running = true;
  if (STRUCT_RE.spinner.some(re => re.test(tail))) { r.kind = 'working'; r.prompt = last.slice(0, 200); return r; }
  if (STRUCT_RE.bash.some(re => re.test(tail))) { r.kind = 'bash'; r.prompt = last; return r; }
  if (STRUCT_RE.option.some(re => re.test(tail))) {
    const opts = [];
    tail.split('\n').forEach(l => { const m = l.match(/^\s*[❯>]?\s*(\d+)[\.\)]\s+(.+?)\s*$/); if (m) opts.push({ index: +m[1], label: m[2].trim() }); });
    if (opts.length >= 2) { r.kind = 'option'; r.options = opts.slice(0, 20); r.prompt = last; return r; }
  }
  if (STRUCT_RE.yesno.some(re => re.test(tail))) { r.kind = 'yesno'; r.prompt = last; return r; }
  if (STRUCT_RE.input.some(re => re.test(tail))) { r.kind = 'input'; r.prompt = last; return r; }
  r.kind = 'working'; r.prompt = last.slice(0, 200);
  return r;
}

// --- Feed incoming data into the structured buffer ---
function feedStructured(base64Payload, agentId) {
  if (agentId !== structAgentId) return;
  let text;
  try { text = decodeURIComponent(escape(atob(base64Payload))); } catch { return; }
  text = structStripAnsi(text);
  // Normalize line ends: \r\n → \n; lone \r (spinner redraws) → \n
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  structBuf += text;
  if (structBuf.length > STRUCT_BUF_MAX) structBuf = structBuf.slice(-STRUCT_BUF_MAX);
  if (!structRenderTimer) structRenderTimer = setTimeout(renderStructured, 80);
}

// --- Render transcript + action bar ---
function renderStructured() {
  structRenderTimer = null;
  const el = document.getElementById('struct-transcript');
  if (!el) return;
  // Collapse runs of blank lines + dedupe consecutive identical lines (spinner noise)
  let lines = structBuf.split('\n');
  const out = [];
  let prev = null, blank = 0;
  for (const l of lines) {
    if (l.trim() === '') { blank++; continue; }
    if (blank > 0 && out.length) out.push('');   // one blank line between blocks
    blank = 0;
    if (l === prev) continue;                     // dedupe consecutive duplicates
    prev = l;
    out.push(l);
  }
  const shown = out.slice(-300);
  // Escape HTML then render
  el.innerHTML = shown.map(l => '<div class="struct-line">' + escapeHtml(l) + '</div>').join('');
  // Auto-scroll unless the user scrolled up
  if (!structUserScrolled) el.scrollTop = el.scrollHeight;

  // Action bar from detector
  renderStructActionbar();
}

function renderStructActionbar() {
  const bar = document.getElementById('struct-actionbar');
  if (!bar) return;
  const st = detectClaudeStateJS(structBuf);
  let html = '';
  if (st.running) {
    if (st.kind === 'yesno') {
      html = `<button class="primary" onclick="structAnswer('yes')">Yes</button>` +
             `<button class="danger" onclick="structAnswer('no')">No</button>`;
    } else if (st.kind === 'option' && st.options.length) {
      html = st.options.map(o =>
        `<button onclick="structAnswer('opt','${o.index}')">${escapeHtml(String(o.index))}. ${escapeHtml(o.label.slice(0,24))}</button>`
      ).join('');
    } else if (st.kind === 'working') {
      html = `<button disabled style="opacity:0.6">Claude 思考中…</button>`;
    } else if (st.kind === 'bash') {
      html = `<button class="primary" onclick="structAnswer('yes')">允许</button>` +
             `<button class="danger" onclick="structAnswer('no')">拒绝</button>`;
    }
  }
  if (html) { bar.innerHTML = html; bar.style.display = 'flex'; }
  else { bar.style.display = 'none'; }
}

// --- Input / actions ---
function structSendRaw(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !currentAgentId || !text) return;
  const bytes = new TextEncoder().encode(text);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  ws.send(JSON.stringify({ type: 'data', payload: btoa(bin), agentId: currentAgentId }));
}
function structSendInput() {
  const inp = document.getElementById('struct-input');
  const v = inp.value;
  if (!v) return;
  structSendRaw(v + '\r');
  inp.value = '';
  inp.focus({ preventScroll: true });
}
function structKey(name) {
  const map = { ctrlc: '\x03', esc: '\x1b', tab: '\t', up: '\x1bOA', down: '\x1bOB', enter: '\r' };
  if (map[name]) structSendRaw(map[name]);
}
function structAnswer(kind, opt) {
  if (kind === 'yes') structSendRaw('y\r');
  else if (kind === 'no') structSendRaw('n\r');
  else if (kind === 'opt') structSendRaw(opt + '\r');
}

// --- Mode toggle (structured ↔ raw xterm) ---
function setTermViewMode(mode) {
  termViewMode = mode;
  const sv = document.getElementById('structured-view');
  const tc = document.getElementById('term-container');
  const mt = document.getElementById('mobile-toolbar');
  const toggle = document.getElementById('float-toggle-view');
  if (mode === 'structured') {
    sv.style.display = 'flex';
    tc.style.display = 'none';
    if (mt) mt.style.display = 'none';
    toggle.textContent = '原始';
    renderStructured();
    // Tell the PTY to render at a phone-friendly width so Claude wraps output
    // for reading instead of using the default 200-col layout.
    if (ws && ws.readyState === WebSocket.OPEN && currentAgentId) {
      ws.send(JSON.stringify({ type: 'resize', agentId: currentAgentId, cols: 100, rows: 40 }));
    }
  } else {
    sv.style.display = 'none';
    tc.style.display = 'block';
    if (window.innerWidth < 600 && mt) mt.style.display = 'block';
    toggle.textContent = '结构';
    // Refit xterm to real size + re-send resize (it was hidden while sizing)
    setTimeout(() => {
      if (fitAddon && term) { try { fitAddon.fit(); } catch {} }
      if (ws && ws.readyState === WebSocket.OPEN && term) {
        ws.send(JSON.stringify({ type: 'resize', agentId: currentAgentId, cols: term.cols, rows: term.rows }));
      }
    }, 60);
  }
}
function toggleTermView() {
  setTermViewMode(termViewMode === 'structured' ? 'xterm' : 'structured');
}

// Track transcript manual scroll so we don't yank the user back to bottom
(function () {
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('struct-transcript');
    if (!el) return;
    el.addEventListener('scroll', () => {
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      structUserScrolled = !atBottom;
    });
  });
})();

// Enter key in the structured input sends
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('struct-input');
  if (inp) inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); structSendInput(); }
  });
});

// ========== Mobile toolbar ==========

function sendRaw(data) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !currentAgentId) return;
  const bytes = new TextEncoder().encode(data);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  ws.send(JSON.stringify({ type: 'data', payload: btoa(bin), agentId: currentAgentId }));
}

function send(seq) {
  if (ctrlActive) {
    const code = seq.charCodeAt(0);
    if (code >= 97 && code <= 122) {
      sendRaw(String.fromCharCode(code - 96));
    } else {
      sendRaw(seq);
    }
    clearCtrl();
  } else {
    sendRaw(seq);
  }
}

function sendCtrl(letter) {
  sendRaw(String.fromCharCode(letter.charCodeAt(0) - 96));
  clearCtrl();
}

function toggleCtrl() {
  ctrlActive = !ctrlActive;
  document.getElementById('btn-ctrl').classList.toggle('active', ctrlActive);
}

function clearCtrl() {
  ctrlActive = false;
  document.getElementById('btn-ctrl').classList.remove('active');
}

function doPaste() {
  // Legacy: try clipboard API (works on desktop), fallback to focusing input bar
  navigator.clipboard.readText().then(t => { if (t) sendRaw(t); }).catch(() => {
    focusMobileInput();
  });
}

function focusMobileInput() {
  const input = document.getElementById('mobile-text-input');
  if (input) input.focus({ preventScroll: true });
}

// Explicit scroll controls for mobile — xterm.js's own scrollback viewport is
// notoriously unreliable to touch-drag on some phones/browsers even with
// -webkit-overflow-scrolling: touch, so these drive the same scroll API a
// mouse wheel would, with no dependency on touch gesture handling at all.
function scrollTermPages(n) {
  if (term) term.scrollPages(n);
}
function scrollTermToBottom() {
  if (term) term.scrollToBottom();
}

function closeMobileInput() {
  const input = document.getElementById('mobile-text-input');
  if (input) input.value = '';
  mobileComposing = false;
}

// Mobile live input: each committed character is sent to the PTY immediately,
// so it feels like a real terminal (echo, mid-line Tab completion, etc.).
// IME-safe: during composition (third-party keyboards on iOS) we never touch
// the textarea value — only send after the IME commits.
let mobileComposing = false;
const mobileInputEl = document.getElementById('mobile-text-input');

mobileInputEl.addEventListener('compositionstart', () => { mobileComposing = true; });
mobileInputEl.addEventListener('compositionend', () => {
  mobileComposing = false;
  mobileDrain();
});
mobileInputEl.addEventListener('input', (e) => {
  if (mobileComposing || e.isComposing) return;   // mid-composition: do NOT read/clear
  mobileDrain();
});
// Backspace should delete in the terminal (otherwise the textarea just empties itself).
mobileInputEl.addEventListener('keydown', (e) => {
  if (mobileComposing || e.isComposing) return;
  if (e.key === 'Backspace') {
    e.preventDefault();
    sendRaw('\x7f');
  }
  // Android keyboards honour enterkeyhint by firing a keydown Enter WITHOUT
  // inserting \n into the textarea (nothing is submitted — there is no form),
  // so the input-event path below never runs and pressing the keyboard's send
  // key appears to do nothing.  Handle keydown Enter for that case; the
  // mobileDrain() guard (empty value → no-op) keeps the input-event fallback
  // from double-sending.
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    mobileDrain();
  }
});

// Drain committed text from the bar into the terminal, then clear it so the
// bar stays a one-line "live" input. \n (iOS return key / pasted newline) → \r.
function mobileDrain() {
  const v = mobileInputEl.value;
  if (!v) return;
  mobileInputEl.value = '';
  sendRaw(v.replace(/\n/g, '\r'));
  mobileInputEl.focus({ preventScroll: true });
}

function mobileSendEnter() {
  sendRaw('\r');
  mobileInputEl.focus({ preventScroll: true });
}

// iOS Safari keyboard adaptation: make #term-view follow the visualViewport
// height so that when the soft keyboard pushes up, the terminal view (and the
// mobile toolbar inside it) shrinks instead of being obscured. On desktop,
// visualViewport.height === innerHeight, so this is a harmless no-op there.
// We also refit xterm within one animation frame so the terminal snaps to the
// new size instead of lagging behind the debounce (which read as "jumping").
(function () {
  const termView = document.getElementById('term-view');
  if (!termView || !window.visualViewport) return;
  const vv = window.visualViewport;
  let fitScheduled = false;
  function syncTermHeight() {
    termView.style.height = vv.height + 'px';
    termView.style.bottom = 'auto';   // height drives sizing, not bottom:0
    termView.style.top = vv.offsetTop + 'px';
    if (!fitScheduled) {
      fitScheduled = true;
      requestAnimationFrame(() => {
        fitScheduled = false;
        if (fitAddon && term) { try { fitAddon.fit(); } catch {} }
      });
    }
  }
  vv.addEventListener('resize', syncTermHeight);
  vv.addEventListener('scroll', syncTermHeight);
  syncTermHeight();
})();
</script>
</body>
